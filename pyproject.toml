[project]
name = "faixamp3"
version = "0.1.0"
description = "Playlists do Spotify em MP3 para o pendrive do carro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.1",
    "platformdirs>=4.13.5",
    "pyside6-essentials>=6.12.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "yt-dlp[default]>=2026.8.19",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
faixamp3 = "faixamp3:main"
faixamp3-gui = "faixamp3.gui:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
