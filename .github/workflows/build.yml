name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Embutir ffmpeg e deno (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/bin | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName packaging/bin/
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath packaging/bin
      - run: uv sync
      - run: uv run python packaging/build.py
      - name: Compactar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/FaixaMP3" -DestinationPath "FaixaMP3-Windows.zip"
      - name: Compactar (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/FaixaMP3.app" "FaixaMP3-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FaixaMP3-${{ runner.os }}
          path: FaixaMP3-${{ runner.os }}.zip
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FaixaMP3-${{ runner.os }}.zip
